name: US Insta Bot Runner

on:
  schedule:
    - cron: '0 22 * * *' 
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install All Tools
        run: |
          pip install --upgrade pip
          pip install pyTelegramBotAPI yt-dlp moviepy requests instagrapi google-generativeai

      - name: Start The Bot
        run: python bot.py
        
