name: US Insta Bot Runner

on:
  schedule:
    # --- US Din ke 3 Slots (12 PM, 3 PM, 5 PM LA Time) ---
    - cron: '0 20 * * *'    # 12:00 PM LA Time (India mein Raat 1:30 AM)
    - cron: '0 23 * * *'    # 03:00 PM LA Time (India mein Subah 4:30 AM)
    - cron: '0 1 * * *'     # 05:00 PM LA Time (India mein Subah 6:30 AM)

    # --- US Raat ke 3 Slots (12 AM, 3 AM, 5 AM LA Time) ---
    - cron: '0 8 * * *'     # 12:00 AM LA Time (India mein Dopahar 1:30 PM)
    - cron: '0 11 * * *'    # 03:00 AM LA Time (India mein Shaam 4:30 PM)
    - cron: '0 13 * * *'    # 05:00 AM LA Time (India mein Shaam 6:30 PM)

  workflow_dispatch:

permissions:
  contents: write  # <--- Yeh line add karni hai

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install All Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install pyTelegramBotAPI instagrapi google-generativeai yt-dlp

      - name: Start The Bot (Process 1 Link)
        run: python bot.py

      - name: Save Memory (Commit Processed Links & Session)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add processed_links.txt || true
          git add session.json || true
          git commit -m "Auto-saved processed link and session" || echo "No changes to save"
          git push
          
