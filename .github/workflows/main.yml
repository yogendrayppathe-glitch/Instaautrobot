name: US Insta Bot Runner

on:
  schedule:
    - cron: '0 * * * *' 
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install All Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install pyTelegramBotAPI instagrapi google-generativeai yt-dlp

      - name: Start The Bot (Process 1 Link)
        run: python bot.py

      - name: Save Memory (Commit Processed Links & Session)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add processed_links.txt
          git add session.json || true
          git commit -m "Auto-saved processed link and session" || echo "No changes to save"
          git push
          
