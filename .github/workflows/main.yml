name: US Insta Bot Runner

on:
  schedule:
    # Slot 1: Subah 8:30 AM EST (Indian Time ke hisaab se shaam ko hota hai, par GitHub UTC par chalta hai)
    - cron: '30 13 * * *'
    # Slot 2: Dopahar 1:00 PM EST
    - cron: '0 18 * * *'
    # Slot 3: Shaam ko 7:30 PM EST
    - cron: '30 23 * * *'
    
  workflow_dispatch: 

permissions:
  contents: write  # <--- Yeh line add karni hai

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install All Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install pyTelegramBotAPI instagrapi google-generativeai yt-dlp

      - name: Start The Bot (Process 1 Link)
        run: python bot.py

      - name: Save Memory (Commit Processed Links & Session)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add processed_links.txt || true
          git add session.json || true
          git commit -m "Auto-saved processed link and session" || echo "No changes to save"
          git push
          
